name: Streamlit Keep-Alive

on:
  schedule:
    # Runs twice a day (at 04:00 and 16:00 UTC) to keep the app active and prevent sleep
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Streamlit App
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          echo "Pinging Streamlit App to keep it awake..."
          # Ping the root endpoint (Streamlit Cloud's ingress registers traffic without following login redirect loops)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://website-analyser-rudra.streamlit.app/" || echo "000")
          echo "Ping response received (HTTP Status: $HTTP_STATUS)"
          echo "Keep-alive ping successfully delivered to Streamlit Cloud."
