name: Security & Automated Integrity CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  security-and-quality-check:
    name: Security & Code Integrity Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Verify Secret Leak Prevention
        run: |
          echo "Scanning codebase for accidentally committed secrets..."
          matches=$(grep -rnEI "AIzaSy[a-zA-Z0-9_-]{33}|sk-[a-zA-Z0-9]{32,}|GTMETRIX_API_KEY\s*=\s*['\"][^'\"]+['\"]" \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            --exclude="*.md" \
            --exclude=".env.example" . | grep -vE "(your_key_here|your_gtmetrix_key|placeholder|YOUR_KEY)" || true)
          if [ -n "$matches" ]; then
            echo "ERROR: Potential hardcoded secret(s) detected:"
            echo "$matches"
            echo "Remove or replace these values with placeholders and move secrets to environment variables."
            exit 1
          fi
          echo "No exposed secrets found."

      - name: Install Python Dependencies & Check Syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app.py agent/app.py agent/config.py agent/backend/*.py agent/frontend/*.py

      - name: Verify Node.js Screenshot Microservice
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          cd screenshot-service
          npm ci
          echo "Running npm vulnerability audit..."
          npm audit --audit-level=high

      - name: Sanity Check Security Policies
        run: |
          echo "Validating SSRF protection & security config..."
          test -f SECURITY.md
          test -f agent/.streamlit/config.toml
          grep -q "enableXsrfProtection = true" agent/.streamlit/config.toml
