[theme]
primaryColor = "#4F46E5"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
base = "light"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
