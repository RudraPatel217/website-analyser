[theme]
primaryColor = "#3b82f6"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"
base = "dark"

[server]
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 10
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
